version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: keyway-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-keyway}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    container_name: keyway-redis
    restart: always
    expose:
      - "6379"

  backend:
    build: ./backend
    container_name: keyway-backend
    restart: always
    environment:
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-keyway-prod-secret-key-9999}
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-keyway}
      - SESSION_REDIS_URL=redis://redis:6379/0
      - PBKDF2_ITERATIONS=${PBKDF2_ITERATIONS:-480000}
      - REVEAL_RATE_LIMIT_PER_MINUTE=${REVEAL_RATE_LIMIT_PER_MINUTE:-10}
      - HEALTHCHECK_TIMEOUT_SECONDS=${HEALTHCHECK_TIMEOUT_SECONDS:-5}
      - FLASK_RUN_PORT=5000
    ports:
      - "5000:5000"
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE_URL=http://localhost:5000
    container_name: keyway-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
